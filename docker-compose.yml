services:
  # FastAPI Backend
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: change-me-in-production-super-secret-key-2024
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./api:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      # Expose full API base (including /api) so the frontend
      # can talk to the backend correctly from inside Docker.
      - VITE_API_URL=http://api:8000/api
