name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Frontend Build & Quality Check
  frontend-build:
    name: Frontend (React + Vite) Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Production Frontend Bundle
        working-directory: ./web
        run: npm run build

  # 2. Node.js Express Server Syntax & Integrity Check
  server-check:
    name: Express API Gateway Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate Server Syntax
        working-directory: ./server
        run: node --check server.js

  # 3. Python AI Microservice Syntax & Lint Check
  python-ai-lint:
    name: AI Microservice (FastAPI + PyTorch) Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install Dependencies & Linter
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi

      - name: Run Flake8 Syntax Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 api/ --count --select=E9,F63,F7,F82 --show-source --statistics
